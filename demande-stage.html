<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demande de stage — ELS STAGE</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><a class="brand" href="/">ELS <span>STAGE</span></a><nav><a href="/candidat.html">Mon espace</a></nav></header><main class="form-page"><form id="stageForm" class="form-card wide" enctype="multipart/form-data"><p class="eyebrow">NOUVELLE DEMANDE</p><h1>Déposer une demande de stage</h1><div class="two"><label>Type de stage<select name="type_stage" required><option value="">Choisir</option><option>Stage académique</option><option>Stage professionnel</option><option>Stage d'immersion</option></select></label><label>Domaine<input name="domain" placeholder="Ex : Informatique" required></label></div><div class="two"><label>Entreprise ciblée<input name="company"></label><label>Date de début<input name="start_date" type="date" required></label></div><label>Date de fin<input name="end_date" type="date" required></label><label>Motivation<textarea name="motivation" rows="6" required placeholder="Présente brièvement ton objectif de stage..."></textarea></label><div class="two"><label>CV (PDF/JPG/PNG, 5 Mo max)<input name="cv" type="file" accept=".pdf,.jpg,.jpeg,.png"></label><label>Lettre (PDF/JPG/PNG, 5 Mo max)<input name="lettre" type="file" accept=".pdf,.jpg,.jpeg,.png"></label></div><button class="btn">Envoyer la demande</button><div id="msg" class="msg"></div></form></main><script src="/js/demande.js"></script></body></html>
