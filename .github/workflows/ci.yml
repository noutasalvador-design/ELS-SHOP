name: Marketplace CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/els_shop?schema=public
      NEXT_PUBLIC_SITE_URL: https://els-shop-marketplace.vercel.app
      AUTH_SECRET: ci-only-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate database schema
        run: npx prisma validate
      - name: Build application
        run: npm run build
